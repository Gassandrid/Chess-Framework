[package]
name = "chess-engine-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "chess_engine_api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "uci"
path = "src/bin/uci.rs"

[[bin]]
name = "perft"
path = "src/bin/perft.rs"

[[bin]]
name = "tournament"
path = "src/bin/tournament.rs"

[[bin]]
name = "compare"
path = "src/bin/compare_engines.rs"

[[bin]]
name = "train_nn"
path = "src/bin/train_nn.rs"

[[bin]]
name = "compare_all"
path = "src/bin/compare_all.rs"

[dependencies]
axum = "0.7.2"
tokio = { version = "1.34.0", features = ["full"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
tower-http = { version = "0.5.0", features = ["cors"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
axum-server = "0.7.1"
lazy_static = "1.4.0"
rand = "0.8.5"
ndarray = "0.15"
rand_distr = "0.4"
